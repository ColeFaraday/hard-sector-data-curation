- {description: Webpage with all figures and tables, location: 'https://cms-results.web.cern.ch/cms-results/public-results/preliminary-results/HIN-25-008/index.html'}
comment: A hot medium, known as the quark-gluon plasma (QGP), is created in collisions
  of relativistic heavy nuclei such as lead or gold. Highly energetic quarks and gluons,collectively
  referred to as partons, lose energy as they travel through the QGP leading to suppressed
  production of particles with transverse momenta (pT) of roughly 10 - 100 GeV. This
  suppression is typically quantified with the nuclear modification factor (RAA).
  Questions regarding what minimum system size is required to see parton energy loss
  effects remain, as no such suppression has been seen in smaller proton-lead collisions.
  Experiments involving light nuclei examine a domain that lies between these two
  extreme cases. Using 6.1 $nb^{-1}$ of oxygen-oxygen (OO) collisions and 1.02 $pb^{-1}$
  of proton-proton data collected at a nucleon-nucleon center-of-mass energy of $\sqrt{s_{NN}}=5.36
  TeV$ by the CMS experiment at the CERN LHC, charged particle invariant cross sections
  and the OO charged particle R_{AA} are measured as a function of particle $p_{T}$
  for the first time. The $R_{AA}$ is notably suppressed, with a local minimum of
  $0.69 \pm 0.04$ at $p_{T}=6 GeV$, but increases to a value of $0.97 \pm 0.06$ at
  $p_{T}=100 \text{GeV}$. To evaluate if parton energy loss effects may be present
  in OO collisions, the data are compared to previous measurements of other collision
  systems and a variety of theoretical models.
hepdata_doi: 10.17182/hepdata.165512.v1
