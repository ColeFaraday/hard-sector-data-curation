# ALICE, production of charged pions, kaons and (anti-)protons in Pb-Pb and inelastic pp
# collisions at 5.02 TeV (arXiv:1910.07678, HEPData ins1759506 v1): the charged-pion R_AA.
#
# Not curated: the spectra (Tables 1-6), particle ratios, and the kaon and proton R_AA
# (Tables 16-17), which the model's leading-hadron finals do not compute.
#
# Not curated, said here: the normalisation of R_AA. The paper shows "the total normalization
# uncertainty (pp and Pb-Pb)" only as a box at pT = 1 GeV/c in its Fig. 10 and gives no
# number; neither HEPData nor the text has one.

record: { inspire_id: 1759506, version: 1 }
paper: "arXiv:1910.07678"
experiment: ALICE
particle: charged_pion
sqrt_s_nn: 5020
system: PbPb
observable: raa
