  - { table: Table 15, column: 10, centrality: [60, 70] }
  - { table: Table 15, column: 11, centrality: [70, 80] }
  - { table: Table 15, column: 3, centrality: [20, 40], note: "Overlaps the 20-30% and 30-40% datasets of this record: the same events." }
