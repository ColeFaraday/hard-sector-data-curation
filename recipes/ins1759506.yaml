  - { table: Table 15, column: 1, centrality: [5, 10] }
  - { table: Table 15, column: 2, centrality: [10, 20] }
  - { table: Table 15, column: 6, centrality: [20, 30] }
  - { table: Table 15, column: 7, centrality: [30, 40] }
  - { table: Table 15, column: 8, centrality: [40, 50] }
