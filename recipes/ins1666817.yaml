# ALICE, energy dependence and fluctuations of anisotropic flow in Pb-Pb collisions at 5.02 and
# 2.76 TeV (arXiv:1804.02944, HEPData ins1666817 v1): v_n of charged particles against pT in
# centrality classes, from the two-particle (|Delta eta| > 1), four-particle and scalar-product
# (|Delta eta| > 2) measurements. 121 of the record's 230 tables: all of Figures 3 and 4.
#
# The method of each group of tables is taken from the paper (Sec. 2, the captions of Figs. 3 and 4,
# the first paragraphs of Sec. 3), not from the table names:
#   Figure 3, names v22Deta1 ... v62Deta1: two-particle cumulant with |Delta eta| > 1
#                                          -> method cumulant2, delta_eta_gap 1
#   Figure 3, names v24:                   four-particle cumulant -> method cumulant4
#   Figure 4, names v22Deta2 ... v42Deta2: NOT a cumulant. The paper obtains v_n{2, |Delta eta| > 2}
#                                          with the scalar product method, correlating the tracks
#                                          at |eta| < 0.8 with the Q-vector of the V0A (2.8 < eta < 5.1)
#                                          -> method SP, delta_eta_gap 2 (the paper's own label)
#
# Acceptance: every table gives ABS(ETA) < 0.8 for the tracks, so eta_range is [-0.8, 0.8]. For the
# |Delta eta| > 1 cumulant the paper forms its pairs between -0.8 < eta < -0.5 and 0.5 < eta < 0.8;
# that is said in the dataset note, not in the acceptance.
#
# Keys: method, harmonic and delta_eta_gap tell the datasets apart, so no `variant` is used. The
# centrality classes of this record are disjoint. Datasets of different methods for the same class,
# harmonic and energy come from the same Pb-Pb data sample, which the notes say.
#
# Not curated (table numbers of the record):
#   1-10, 193-200  v_n and v_2{m} against centrality, integrated over 0.2-3 GeV/c (Figs. 1, 9): the
#                  independent variable is the centrality, not pT
#   11-14          ratios of the two energies against centrality (Fig. 2)
#   137-145        ratios of v_n(pT) between 5.02 and 2.76 TeV (Fig. 5)
#   146-168        v_n(pT) ratios to the 20-30% class, the RatioTo2030 tables (Fig. 7)
#   169-192        ratios v_n(pT) / v_m(pT)^(n/m) (Fig. 8)
#   201-208        cumulants c_2{m} against centrality (Fig. 10)
#   209-215        ratios and differences of v_2{m} against centrality (Figs. 11, 13, 14)
#   216-219        skewness and Elliptic Power parameters against centrality (Figs. 15, 16)
#   220-231        distributions P(v_2 / <v_2>) (Fig. 17 and the appendix): fluctuation observables

record: { inspire_id: 1666817, version: 1 }
paper: "arXiv:1804.02944"
experiment: ALICE
particle: charged
observable: vn
system: PbPb
centrality_definition: ALICE_V0M
acceptance: { eta_range: [-0.8, 0.8] }

datasets:
  # ===== Pb-Pb at 5.02 TeV =====
  # v_2{2, |Delta eta| > 1}, two-particle cumulant (Figure 3): 8 classes
