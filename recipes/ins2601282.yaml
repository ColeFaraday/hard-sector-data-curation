    acceptance: { y_range: [-2.5, 2.0] }
    note: "The pp cross section for -2.5 < y* < 2.0, the pp baseline of the R_pPb in this HEPData record (its overview: the pp reference for p+Pb). As for the p+Pb data, its corrections are made as a function of y* with the pion mass assumed for all particles (arXiv:2211.15257, Sec. 6)."
