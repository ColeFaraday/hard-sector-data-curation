# ATLAS, charged-hadron production in pp, p+Pb, Pb+Pb and Xe+Xe collisions at 5 TeV
# (arXiv:2211.15257, HEPData ins2601282 v2): R_AA in Pb+Pb at 5.02 TeV and in Xe+Xe at
# 5.44 TeV and R_pPb at 5.02 TeV, all as functions of pT, and the pp reference spectra.
#
# Acceptance. Each table's window is written as its qualifier gives it. An ABS(ETA) window
# that starts at 0 is an eta_range [-hi, hi]; one that starts above 0 (0.2-0.4 and so on) is an
# abs_eta_range [lo, hi]. A Y* window is a y_range as written, with its sign.
#
# Variants. The full window of each set (|eta| < 2.5, or -2.5 < y* < 2.0) has no variant and
# every slice has one, made of its window with the numbers written as %g and an m for a minus
# sign (a minus sign cannot be told from the separator):
#   |eta| slices   abseta<lo>-<hi>   abseta0-0.2, abseta0.2-0.4, ..., abseta2.2-2.5
#   y* slices      ystar<lo>-<hi>    ystarm2.5-m2.2, ..., ystarm0.1-0.2, ..., ystar1.7-2
# The R_AA and R_pPb datasets have one window each, so no variant.
#
# pp reference. HEPData's header gives 1/(2 pi pT) d2(sigma)/dpT/dy for the y* windows and
# 1/(2 pi pT) d2(sigma)/dpT/deta for the |eta| windows, in mb/GeV^2, so the datasets are
# INVARIANT_CROSS_SECTION_DY and INVARIANT_CROSS_SECTION_DETA. The pp tables at 5.44 TeV are the
# baseline of the Xe+Xe R_AA: the paper gets them by extrapolating its 5.02 TeV pp spectrum
# (Secs. 1 and 6); the HEPData descriptions of those tables do not say so.
#
# Not curated:
#  - the heavy-ion spectra divided by <T_AA> or <T_pPb> (336 tables: 2-9, 11-18, 20-27 and
#    their y* and |eta| slices among 141-490), which are per-event yields, not ratios to pp;
#  - R_pPb against y* and R_AA against |eta|, each in fixed pT windows (88 tables, 52-139:
#    R_pPb 32, Pb+Pb 32, Xe+Xe 24). Their independent variable is not pT and HEPData gives it
#    no units; the registry's raa has pT as its only x, and the build refuses an x without units;
#  - the Overview table, which has no data.

