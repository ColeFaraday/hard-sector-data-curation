errors:
  sys:
    note: "HEPData gives one systematic uncertainty per point. The paper lists the individual sources for selected pT intervals (Tables 3 and 4) and says the total systematic uncertainty is their sum in quadrature (arXiv:1808.03951, Sec. 5)."
  total:
    note: "The statistical and systematic uncertainties added in quadrature, as the caption of Fig. 13 of arXiv:1808.03951 says. For the 0-5% class it reproduces the stat and sys of the Fig. 6 table within the rounding of the published digits."
