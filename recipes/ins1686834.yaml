# ATLAS, azimuthal anisotropy of charged particles in Pb+Pb collisions at 5.02 TeV
# (arXiv:1808.03951, HEPData ins1686834 v1): v_n against pT in centrality classes, n = 2 to 7,
# by the scalar product (SP), event plane (EP) and two-particle correlation (2PC) methods.
#
# Curated: every table whose independent variable is pT and that gives v_n in a centrality
# class, 190 datasets. All of them are for tracks with |eta| < 2.5 (the tables' ETARAP), the
# widest window of the record. No table gives v_n against pT in a narrower eta window (v_n in
# eta bins is only given against eta, which is not curated), so no dataset has an eta-window
# variant. The 2PC datasets also carry the pair gap, delta_eta_gap 2.
#
#   family            HEPData figure  tables    harmonics and classes
#   SP                Fig. 5          1-60      v2-v5 0-0.1% to 70-80%; v6 0-5% to 70-80%; v7 0-5% to 50-60%
#   EP                Fig. 16         288-347   the same harmonics and classes as SP
#   EP, run1-bins     Fig. 10         136-150   v2-v6 in 0-5%, 20-30% and 40-50%
#   2PC               Fig. 6          61-103    v2-v4 0-5% to 70-80%; v5 and v6 0-5% to 60-70%
#   2PC, total-err    Fig. 13         260-271   v2 and v3 in 0-5%, 10-15%, 20-25%, ..., 50-55%
#
# Variant labels. A family without a variant is the main table of its method; a variant names
# how another family differs from it. run1-bins: the EP data in pT bins matched to the Run 1
# (2.76 TeV) result (Fig. 10; HEPData's description says so). total-err: the 2PC data of Fig.
# 13, which carry one total uncertainty instead of stat and sys. A variant family repeats the
# class and method of the main family (EP and run1-bins, 2PC and total-err), which the dataset
# notes say. The SP, EP and 2PC datasets of one class come from the same minimum-bias events
# (arXiv:1808.03951, Sec. 4); the SP and EP datasets of the 0-1% and 0-0.1% classes also use
# the ultra-central trigger samples (Secs. 3 and 4).
#
# A note shared by several datasets is written once, with a YAML anchor (&name) at its first
# use, and referred to afterwards with an alias (*name).
#
# Not curated, because pT is not their independent variable or they are not v_n itself:
#   - the ratios v_n{SP}/v_n{EP} against pT and <Npart> (Fig. 7, tables 104-123) and
#     v_n{SP}/v_n{2PC} against pT (Fig. 8, tables 124-135);
#   - v_n against pseudorapidity (Figs. 11 and 17, tables 151-217 and 348-414);
#   - v_n against <Npart> (Figs. 12 and 18, tables 218-259 and 415-456);
#   - the scaled v_2 and v_3 against pT (Fig. 13 right panels, tables 272-283) and the pT and
#     v_n scale factors against centrality (Fig. 14, tables 284-287).

record: { inspire_id: 1686834, version: 1 }
paper: "arXiv:1808.03951"
experiment: ATLAS
particle: charged
sqrt_s_nn: 5020
system: PbPb
observable: vn
centrality_definition: ATLAS_FCAL_ET
acceptance: { eta_range: [-2.5, 2.5] }

