# ATLAS, measurement of charged-particle spectra in Pb+Pb collisions at 2.76 TeV
# (arXiv:1504.04337, HEPData ins1360290 v2): R_CP and R_AA against pT, and the pp spectra.
#
# Acceptance. A table's ABS(ETA) qualifier is its window. A window that starts at 0 is an
# eta_range [-hi, hi]; one with a nonzero lower edge is an abs_eta_range [lo, hi]. The widest
# window of each family has no variant: |eta| < 2.0 for R_AA and the pp spectrum, 0.0-2.5 for
# R_CP. Every other window carries the variant abseta<lo>-<hi>, the edges written as short as
# possible: abseta0-0.25, abseta0.25-0.5, ..., abseta1.75-2 for the eight windows of Figs. 11
# and 14, and abseta0-1 for the R_AA of Table 49 (|eta| < 1.0).
#
# The pp spectra in |eta| windows (Tables 10, 12, ..., 24) are the pp denominators of the R_AA
# windows (Tables 41-48), so they are listed with the |eta| < 2.0 spectrum (Table 1).
#
# Not curated: the Pb+Pb spectra (Tables 2-9, and Tables 11, 13, ..., 25 in |eta| windows),
# which are not ratios to pp; the cross sections against |eta| at fixed pT (Tables 54-89); and
# R_AA against <Npart> (Tables 50-53) and against |eta| at fixed pT (Tables 90-121), whose
# independent variable is not pT.

