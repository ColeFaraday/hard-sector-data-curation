errors:
  sys:
    note: >-
      The total systematic uncertainty: HEPData gives one number per point and does not split it
      into sources. The paper adds the uncertainties of its sources in quadrature and applies each
      variation to the Pb+Pb and pp data at once, so that R_AA and R_CP follow the correlated
      changes of numerator and denominator (arXiv:1504.04337, Sec. 7). Its Table 4 lists the maximum
      size of each source for the spectra, R_CP and R_AA, among them the pp luminosity, <T_AA> and
      <T_AA>/<T_AA(60-80%)>.
