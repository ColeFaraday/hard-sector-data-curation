note: "Multiparticle cumulant method. The table qualifiers list |Delta eta| > 3, as the SP tables do, but the paper describes an eta gap only for the SP method and none for the cumulants, so no delta_eta_gap is recorded. The qualifier pT > 1.0 GeV/c is the lower pT limit of the tracks, since the paper restricts primary tracks to |eta| < 1 and pT > 1 GeV/c; pT is the table's independent variable, so the qualifier is not recorded as a pt_range. The paper evaluates the statistical uncertainties of the cumulants by dividing the data set into 10 subsets of roughly equal numbers of events and taking the standard deviation of the cumulant over them (arXiv:1702.00630, sections 'Analysis technique' and 'Event and track selections'). The v2{SP} dataset of this record and the other two cumulant datasets for the same class come from the same PbPb data set (404 ub^-1 collected in 2015; section 'Event and track selections') and so overlap this one."
