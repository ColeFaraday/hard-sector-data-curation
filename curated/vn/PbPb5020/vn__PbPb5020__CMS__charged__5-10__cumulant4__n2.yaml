  sys: { label: sys, note: "The shaded boxes of the paper's figures. The paper names the sources (arXiv:1702.00630, section 'Systematic uncertainties'): the vertex position selection and the pT dependence of the tracking efficiency corrections (below 1% and independent of pT and centrality, common to the SP and cumulant results); the track selection, for misreconstructed tracks (about 2% at low pT rising to about 50% above 60 GeV/c for SP and to about 12% for the cumulants); and, for SP only, few-particle correlations, from varying the eta gap (0 to 0.022 in absolute value for v2 and 0 to 0.030 for v3)." }
