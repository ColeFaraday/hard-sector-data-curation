note: "Scalar product method. The paper imposes a large eta gap between the track vector (|eta| < 1) and the HF vector taken on the opposite side of the tracker (HF covering 3 < |eta| < 5); the table gives it as |Delta eta| > 3. The qualifier pT > 1.0 GeV/c is the lower pT limit of the tracks, since the paper restricts primary tracks to |eta| < 1 and pT > 1 GeV/c; pT is the table's independent variable, so the qualifier is not recorded as a pt_range (arXiv:1702.00630, sections 'Analysis technique' and 'Event and track selections'). The v2{4}, v2{6} and v2{8} datasets of this record for the same class come from the same PbPb data set (404 ub^-1 collected in 2015; section 'Event and track selections') and so overlap this one."
