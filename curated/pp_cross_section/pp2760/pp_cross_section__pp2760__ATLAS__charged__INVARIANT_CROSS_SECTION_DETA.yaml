note: "HEPData titles the quantity 1/(2 pi pT) d^2 sigma/(dpT d eta) in mb/GeV^2, the invariant cross section per unit pseudorapidity. In Sec. 7.1 of arXiv:1504.04337 the paper names the invariant cross section as carrying the 3% pp luminosity uncertainty, and it shows the spectrum as the pp cross section in its Fig. 10. The pp data are limited to |eta| < 2 (Sec. 5.1). Overlaps the pp datasets in |eta| windows of this record, which are parts of it."
