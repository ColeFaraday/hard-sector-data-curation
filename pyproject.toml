[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hsdc"
version = "0.1.0"
description = "Curated hard-sector experimental data: build it from HEPData records, and read it"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6", "jsonschema>=4.18"]

[project.optional-dependencies]
tidy = ["pandas"]
test = ["pytest", "pandas"]

[project.scripts]
hsdc = "hsdc.cli:main"

[tool.setuptools]
package-dir = { "" = "tools" }
packages = ["hsdc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
